name: TSL8Restore
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
targets:
  TSL8Restore:
    type: application
    platform: iOS
    sources:
      - Sources
    resources:
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tsl8restore.mode
        PRODUCT_NAME: TSL8Restore
        MARKETING_VERSION: '1.1.2'
        CURRENT_PROJECT_VERSION: '6'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Restore模式
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: 用于扫描、连接附近的蓝牙设备并读写 TSL 模块配置。
        INFOPLIST_KEY_NSBluetoothPeripheralUsageDescription: 用于连接 TSL 蓝牙模块。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
schemes:
  TSL8Restore:
    build:
      targets:
        TSL8Restore: all
    run:
      config: Debug
    archive:
      config: Release
